*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0b1226;color:#fff;font-family:'Noto Sans JP',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 10px 30px;user-select:none}
button{font-family:inherit;font-weight:900;border:0;border-radius:12px;cursor:pointer;color:#fff}
.top{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:1.25rem;font-weight:900;background:linear-gradient(#ffe9a8,#ff6b3d);-webkit-background-clip:text;color:transparent}
.tag{font-size:.75rem;font-weight:900;background:#0008;padding:5px 10px;border-radius:999px}
#hud{display:flex;gap:8px;width:100%;max-width:440px}
.hp{position:relative;flex:1;background-size:100% 100%;background-repeat:no-repeat;container-type:inline-size}
.hp .val{font-family:BBSans,"Noto Sans JP",sans-serif;position:absolute;display:flex;align-items:center;justify-content:center;font-weight:900;white-space:nowrap}
.hp .val b{display:inline-block;font-weight:900}
#hud .val{color:#fff;font-size:10px;font-size:11.5cqw;line-height:1;text-shadow:0 0 .35em #4aa8ff,0 .06em 0 #0a2a6a,0 0 .12em #0a2a6a}
#hud .val b{font-size:inherit}
.bump{animation:bump .35s}@keyframes bump{40%{transform:scale(1.35);color:#ffe066}}
#items{display:flex;gap:4px;width:100%;max-width:440px}
.hc{position:relative;flex:1;background-size:100% 100%;background-repeat:no-repeat;container-type:inline-size;filter:saturate(.5) brightness(.72);transition:filter .3s}
.hc.on{filter:none}
.hc .val .u{font-size:inherit;margin-left:0}
#vM{transform:translateY(-2.2cqw)}
.hc .val.dash{transform:translateY(-4cqw)}
#vR{font-size:14px!important;font-size:14cqw!important;padding-left:1cqw;align-items:baseline!important;padding-top:.8cqw;transform:translateY(-2cqw)}
.hc .val.sm{font-size:10px;font-size:11cqw;justify-content:flex-start;padding-left:.5cqw}
.hc .val{font-family:BBSans,"Noto Sans JP",sans-serif;position:absolute;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;font-size:17cqw;line-height:1;color:#ffe27a;text-shadow:0 .06em 0 #5a1d00,0 0 .12em #5a1d00,.03em .03em 0 #5a1d00,-.03em .03em 0 #5a1d00;white-space:nowrap}
#play{margin-bottom:14px;display:flex;gap:6px;width:100%;max-width:520px;align-items:stretch;justify-content:center}
#pay{flex:0 0 100px;align-self:center}
#payw{position:relative;width:100%;container-type:inline-size}
#payw img{position:absolute;display:block}
#payw .pb{left:0;width:100%}
#payw .pt2{top:0;z-index:2}
#payRows{position:absolute;inset:0;z-index:3}
.pr{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:999px}
.pr b{font-family:BBSans,"Noto Sans JP",sans-serif;font-weight:900;font-style:italic;color:#ffe27a;line-height:1;white-space:nowrap;text-shadow:0 .05em 0 #4a1700,.04em 0 0 #4a1700,-.04em 0 0 #4a1700,0 -.04em 0 #4a1700}
.pr.hit{animation:phit .9s}@keyframes phit{0%,60%{background:#ffd84a88;transform:scale(1.06)}100%{background:transparent}}
#stage{position:relative;flex:1 1 0;min-width:0;max-width:440px;aspect-ratio:440/500}
#cv{position:absolute;inset:0;width:100%;height:100%}
#msg2{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:1.9rem;font-weight:900;text-shadow:0 3px 0 #0008,0 0 14px #fff8;pointer-events:none}
#msg{font-size:.85rem;font-weight:900}#msg:empty{display:none}
#skip{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:-25px;z-index:5;margin:0;background:#000c;border:1px solid #f5c84299;padding:5px 18px;font-size:.74rem;border-radius:999px}
#buys{position:relative;width:100%;max-width:440px;background-size:100% 100%;background-repeat:no-repeat;container-type:inline-size;transition:filter .3s}
#buys.busy{filter:brightness(.62) saturate(.8)}

function rain(on){document.querySelectorAll('.coinfall').forEach(e=>e.remove());$('resT').classList.toggle('epic',on);if(!on)return;$('resT').textContent='超大当たり！！';
  for(let i=0;i<36;i++){const c=document.createElement('div');c.className='coinfall';c.innerHTML='<img src="'+COINIMG+'" style="width:100%;height:100%;display:block">';c.style.left=Math.random()*100+'%';c.style.animationDelay=Math.random()*2+'s';{const z=26+Math.random()*26;c.style.width=c.style.height=z+'px'}$('res').appendChild(c)}}
async function buyApi(price){
  const {data:{session}}=await db.auth.getSession();
  if(!session){$('msg').textContent='ログインしてください';setTimeout(()=>location.href='/',1200);return null}
  const r=await fetch('/api/cluster',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:session.user.id,userToken:session.access_token,packId:PACK_ID,price})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.set||!j.set.blast){$('msg').textContent=j.error||'エラーが発生しました';return null}
  return j}
async function loadCoin(){try{const {data:{session}}=await db.auth.getSession();if(!session){$('coinTag').textContent='未ログイン';return}
  const {data}=await db.from('users').select('coin_points').eq('id',session.user.id).single();if(data){coin=data.coin_points;$('coinTag').textContent='🪙 '+fmt(coin)}}catch(e){}}
async function start(price){
  if(busy)return;au();
  if(coin<price){$('msg').textContent='コインが足りません';return}
  busy=true;setDis(true);$('msg').textContent='';sfx.buy();
  let j=null;try{j=await buyApi(price)}catch(e){$('msg').textContent='通信エラーが発生しました'}
  if(!j){busy=false;setDis(false);return}
  bgm('battle');skip=false;shown=0;CUR_ITEM=j.item||null;D=j.set.D;MAXWIN=j.set.maxWin;
  coin=j.item?j.coin:j.coin-j.set.total;$('coinTag').textContent='🪙 '+fmt(coin);
  const f=j.set.blast;cells=f.init.map(row=>row.map(x=>x.t));bombs=[];flames=[];gemsOn=[];parts=[];bigs=[];pops=[];bomber={x:W/2,y:BY,z:0,face:1,sq:0,cheer:0,vis:true};sR=2;sM=1;sP=false;sG=false;sTot=TRIES;curN=0;chips();
  $('cur').textContent='0';$('skip').style.display='inline-block';
  await sl(500);await play(f,price);
  const win=j.set.total;setCur(win);coin=j.coin;$('coinTag').textContent='🪙 '+fmt(coin);$('skip').style.display='none';
  bgm(null);if(win>=price*5)sfx.epic();else if(win>=price)sfx.win();else sfx.lose();
  $('resT').textContent=win>=price*5?'大勝利！！':win>=price?'大当たり！':'結果';$('resV').textContent=fmt(win)+' コイン';$('resN').textContent='';
  {const it=CUR_ITEM,esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
   $('resItem').innerHTML=it?`<div class="t">🎁 商品獲得！</div>${it.image_url?`<img src="${esc(it.image_url)}" alt="">`:''}<div class="nm">${esc(it.name)}</div><div class="vl">交換価値 ${fmt(it.value)} コイン</div>`:'';
   $('resCvt').style.display=it&&it.exchange_type!=='ship_only'?'':'none';$('resCvt').disabled=false;$('resOk').textContent=it?'アイテムを保持':'OK'}
  $('res').style.display='flex';rain(win>=price*5)}
$('resCvt').onclick=async()=>{const it=CUR_ITEM;if(!it)return;$('resCvt').disabled=true;
  try{const {data:{session}}=await db.auth.getSession();
    const rr=await fetch('/api/cluster',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'convert',userId:session.user.id,userToken:session.access_token,sessionId:it.sessionId})});
    const d=await rr.json().catch(()=>({}));
    if(!rr.ok||!d.ok){$('msg').textContent=d.error||'交換できませんでした。アイテム欄から交換できます';$('resCvt').disabled=false;return}
    CUR_ITEM=null;coin=d.coin;$('coinTag').textContent='🪙 '+fmt(coin);$('resOk').click();$('msg').textContent=fmt(d.bonus)+'コインに交換しました'
  }catch(e){$('msg').textContent='交換できませんでした';$('resCvt').disabled=false}};
$('resOk').onclick=()=>{if(CUR_ITEM){$('msg').textContent='アイテム欄に入りました';CUR_ITEM=null}sfx.click();bgm('lobby');document.querySelectorAll('.coinfall').forEach(e=>e.remove());$('res').style.display='none';busy=false;setDis(false);newCells();bombs=[];flames=[];bomber={x:W/2,y:BY,z:0,face:1,sq:0,cheer:0,vis:true};shown=0;sR=2;sM=1;sP=false;sG=false;sTot=TRIES;curN=0;chips();$('cur').textContent='0'};

document.addEventListener('pointerdown',()=>{au();if(!busy&&!bgmMode)bgm('lobby')},{once:false});


if(!PACK_ID){$('msg').textContent='パックが指定されていません'}
else fetch('/api/cluster',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'info',packId:PACK_ID})})
  .then(r=>r.json().then(j=>({ok:r.ok,j})))
  .then(({ok,j})=>{if(!ok||!j.prices){$('msg').textContent=j.error||'パックが見つかりません';return}
    PRICES=j.prices;SEL=PRICES[0];if(j.name)document.title=j.name;makeButtons();
    if(j.enabled===false)$('msg').textContent='現在は公開されていません(管理者のみ遊べます)'})
  .catch(()=>{$('msg').textContent='読み込みに失敗しました'});
loadCoin();
</script></body></html>
