<!DOCTYPE html>

		<script>
(function(){
  var errors = [];

  // キャプチャフェーズで拾う(リソース404はバブルしないため必須)
  window.addEventListener('error', function(e){
    if(e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK' || e.target.tagName === 'IMG')){
      errors.push('[読込失敗] <' + e.target.tagName + '> ' + (e.target.src || e.target.href));
    } else {
      errors.push('[実行エラー] ' + e.message + ' @ ' + e.filename + ':' + e.lineno);
    }
  }, true);

  function box(html){
    var old = document.getElementById('diagBox');
    if(old) old.remove();
    var b = document.createElement('div');
    b.id = 'diagBox';
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;color:#000;font-size:11px;padding:10px;z-index:2147483647;overflow:auto;font-family:monospace;white-space:pre-wrap;border:4px solid red';
    b.innerHTML = html;
    document.body.appendChild(b);
  }

  window.addEventListener('load', function(){
    setTimeout(function(){
      var out = [];

      out.push('=== ① 読込エラー ===');
      out.push(errors.length ? errors.join('\n') : '(なし)');

      out.push('\n=== ② scriptタグ一覧(HTML内の順序) ===');
      var scripts = [].slice.call(document.querySelectorAll('script'));
      scripts.forEach(function(s, i){
        out.push(i + ': ' + (s.src ? s.src.replace(location.origin,'') : '(インライン ' + s.textContent.length + '文字)'));
      });

      out.push('\n=== ③ 主要変数の状態 ===');
      ['jQuery','$','createjs','MobileDetect','TweenMax','browserSupport','checkBrowser','initPreload','initMain','loader','gameData','gameContainer','slots_arr','isLoaded'].forEach(function(n){
        out.push(n + ' = ' + (typeof window[n]));
      });

      out.push('\n=== ④ ファイル実体チェック ===');
      var files = scripts.filter(function(s){return s.src;}).map(function(s){return s.src;});
      var links = [].slice.call(document.querySelectorAll('link[rel=stylesheet]')).map(function(l){return l.href;});
      var all = files.concat(links).filter(function(u){ return u.indexOf(location.origin) === 0; });

      Promise.all(all.map(function(url){
        return fetch(url, {cache:'no-store'}).then(function(r){
          return r.text().then(function(t){
            var head = t.slice(0,60).replace(/</g,'&lt;').replace(/\n/g,' ');
            var isHtml = /^\s*(<!DOCTYPE|<html)/i.test(t);
            return url.replace(location.origin,'') + '\n   status=' + r.status +
                   ' type=' + r.headers.get('content-type') +
                   ' bytes=' + t.length +
                   (isHtml ? '\n   ★HTMLが返ってきてる(すり替わり)' : '') +
                   '\n   先頭: ' + head;
          });
        }).catch(function(e){
          return url.replace(location.origin,'') + '\n   ★取得失敗: ' + e.message;
        });
      })).then(function(results){
        out.push(results.join('\n'));
        box(out.join('\n'));
      });

      box(out.join('\n') + '\n\n(④を確認中...)');
    }, 3000);
  });
})();
</script>

		<script>
(function(){
  var errors = [];
  window.addEventListener('error', function(e){
    errors.push({
      msg: e.message,
      file: e.filename,
      line: e.lineno,
      col: e.colno
    });
    render();
  });

  function render(){
    var old = document.getElementById('jsErrBox');
    if(old) old.remove();
    var box = document.createElement('div');
    box.id = 'jsErrBox';
    box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fff;color:#c00;font-size:12px;padding:10px;z-index:999999;max-height:60%;overflow:auto;font-family:monospace;border:4px solid red;white-space:pre-wrap';
    if(errors.length === 0){
      box.innerHTML = '<b>JSエラー検出中...(まだエラーなし)</b>';
    } else {
      box.innerHTML = '<b>JSエラー検出: ' + errors.length + '件</b><br>' +
        errors.map(function(e, i){
          return (i+1) + '. ' + e.msg + '\n   file: ' + e.file + '\n   line: ' + e.line + ':' + e.col;
        }).join('\n\n');
    }
    document.body.appendChild(box);
  }

  document.addEventListener('DOMContentLoaded', function(){
    render();
    setTimeout(render, 4000);
  });
})();
</script>

    <script>
setTimeout(function(){
  var lines = [];
  try{
    lines.push('loader.progress = ' + loader.progress);
    lines.push('loader.loaded = ' + loader.loaded);
    var items = loader._loadQueue || loader._loadQueueBackup || [];
    lines.push('queue length = ' + items.length);
    var failed = [];
    items.forEach(function(it){
      if(it && it.item && it.loaded === false){
        failed.push(it.item.src || it.item.id);
      }
    });
    lines.push('未完了アイテム数 = ' + failed.length);
    failed.slice(0,20).forEach(function(f){ lines.push(' - ' + f); });
  }catch(ex){
    lines.push('loader確認エラー: ' + ex.message);
  }
  lines.push('gameData.paused = ' + (typeof gameData!=='undefined'?gameData.paused:'?'));
  lines.push('curPage = ' + (typeof curPage!=='undefined'?curPage:'?'));
  try{ lines.push('gameContainer.visible = ' + gameContainer.visible); }catch(ex){ lines.push('gameContainer未定義'); }
  try{ lines.push('mainContainer.visible = ' + mainContainer.visible); }catch(ex){}
  try{ lines.push('canvasHolder display = ' + document.getElementById('canvasHolder').style.display); }catch(ex){}

  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fff;color:#000;font-size:12px;padding:12px;z-index:999999;max-height:100%;overflow:auto;font-family:monospace;border:4px solid purple;word-break:break-all';
  box.innerHTML = '<b>ローダー診断</b><br>' + lines.join('<br>');
  document.body.appendChild(box);
},4000);
    </script>
